
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="おえかきランド">

  <title>おえかきランド</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        "Meiryo",
        sans-serif;
      background: #f7f8fc;
      color: #333;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* =========================
       トップ画面
    ========================= */

    #homeScreen {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 32px 20px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .title {
      margin: 10px 0 4px;
      font-size: clamp(36px, 8vw, 64px);
      font-weight: 900;
      letter-spacing: 0.08em;
      text-align: center;
    }

    .subtitle {
      margin: 0 0 30px;
      font-size: clamp(15px, 3vw, 21px);
      color: #777;
      text-align: center;
    }

    .menu {
      width: min(900px, 100%);
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .menu-button {
      min-height: 105px;
      border: 3px solid #333;
      border-radius: 22px;
      background: white;
      color: #333;
      font-size: clamp(20px, 4vw, 30px);
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 5px 0 #333;
      transition: transform 0.08s, box-shadow 0.08s;
    }

    .menu-button:active {
      transform: translateY(5px);
      box-shadow: 0 0 0 #333;
    }

    .menu-button .small {
      display: block;
      margin-top: 7px;
      font-size: 13px;
      font-weight: 500;
      color: #888;
    }

    .menu-button.preparing {
      background: #eeeeee;
      color: #999;
      border-color: #aaa;
      box-shadow: 0 5px 0 #aaa;
    }

    .random-button {
      grid-column: 1 / -1;
      min-height: 82px;
      background: #333;
      color: white;
      border-color: #333;
      box-shadow: 0 5px 0 #111;
    }

    /* =========================
       お絵かき画面
    ========================= */

    #drawingScreen {
      display: none;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      position: fixed;
      inset: 0;
      background: white;
      flex-direction: column;
    }

    .drawing-header {
      height: 58px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-bottom: 2px solid #ddd;
      background: #fafafa;
    }

    .header-button {
      min-width: 76px;
      min-height: 42px;
      padding: 8px 14px;
      border: 2px solid #333;
      border-radius: 12px;
      background: white;
      font-weight: 700;
      cursor: pointer;
    }

    .drawing-title {
      font-size: 20px;
      font-weight: 800;
    }

    #canvasArea {
      flex: 1;
      min-height: 0;
      position: relative;
      background: white;
    }

    #drawingCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      background: white;
    }

    .drawing-toolbar {
      min-height: 76px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px;
      border-top: 2px solid #ddd;
      background: #fafafa;
      overflow-x: auto;
    }

    .tool-button {
      flex: 0 0 auto;
      min-width: 64px;
      min-height: 54px;
      padding: 6px 10px;
      border: 2px solid #333;
      border-radius: 12px;
      background: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .tool-button.active {
      background: #333;
      color: white;
    }

    /* =========================
       iPad 縦向き
    ========================= */

    @media (max-width: 700px) {
      #homeScreen {
        padding: 24px 14px 30px;
      }

      .menu {
        gap: 12px;
      }

      .menu-button {
        min-height: 90px;
        border-radius: 18px;
      }

      .drawing-toolbar {
        justify-content: flex-start;
      }
    }

    /* =========================
       iPad 横向き
    ========================= */

    @media (min-width: 701px) {
      .menu {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       トップ画面
  ========================= -->

  <main id="homeScreen">

    <h1 class="title">おえかきランド</h1>
    <p class="subtitle">すきなあそびをえらんでね</p>

    <div class="menu">

      <button class="menu-button" onclick="openDrawing()">
        じゆうにおえかき
        <span class="small">すきなものをかこう</span>
      </button>

      <button class="menu-button preparing">
        おだいにちょうせん
        <span class="small">じゅんびちゅう</span>
      </button>

      <button class="menu-button preparing">
        おえかきタイムアタック
        <span class="small">じゅんびちゅう</span>
      </button>

      <button class="menu-button preparing">
        へんなおだい
        <span class="small">じゅんびちゅう</span>
      </button>

      <button class="menu-button preparing">
        おえかきしりとり
        <span class="small">じゅんびちゅう</span>
      </button>

      <button class="menu-button preparing">
        へんしんおえかき
        <span class="small">じゅんびちゅう</span>
      </button>

      <button class="menu-button preparing">
        すたんぷあそび
        <span class="small">じゅんびちゅう</span>
      </button>

      <button class="menu-button preparing">
        まちをつくろう
        <span class="small">じゅんびちゅう</span>
      </button>

      <button class="menu-button preparing">
        わたしのさくひん
        <span class="small">じゅんびちゅう</span>
      </button>

      <button class="menu-button random-button">
        なにしてあそぶ？
      </button>

    </div>

  </main>


  <!-- =========================
       じゆうにおえかき画面
  ========================= -->

  <section id="drawingScreen">

    <header class="drawing-header">
      <button class="header-button" onclick="closeDrawing()">
        ← もどる
      </button>

      <div class="drawing-title">
        じゆうにおえかき
      </div>

      <button class="header-button">
        ほぞん
      </button>
    </header>

    <div id="canvasArea">
      <canvas id="drawingCanvas"></canvas>
    </div>

    <div class="drawing-toolbar">

      <button class="tool-button active">
        えんぴつ
      </button>

      <button class="tool-button">
        けしごむ
      </button>

      <button class="tool-button">
        いろ
      </button>

      <button class="tool-button">
        ふとさ
      </button>

      <button class="tool-button">
        ぬりつぶし
      </button>

      <button class="tool-button">
        もどす
      </button>

      <button class="tool-button">
        すすむ
      </button>

      <button class="tool-button">
        ぜんぶけす
      </button>

    </div>

  </section>


  <script>

    /* =========================
       画面切り替え
    ========================= */

    function openDrawing() {
      document.getElementById("homeScreen").style.display = "none";
      document.getElementById("drawingScreen").style.display = "flex";

      resizeCanvas();
    }

    function closeDrawing() {
      document.getElementById("drawingScreen").style.display = "none";
      document.getElementById("homeScreen").style.display = "flex";
    }


    /* =========================
       キャンバス
    ========================= */

    const canvas = document.getElementById("drawingCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();

      const ratio = window.devicePixelRatio || 1;

      canvas.width = rect.width * ratio;
      canvas.height = rect.height * ratio;

      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

      ctx.fillStyle = "white";
      ctx.fillRect(0, 0, rect.width, rect.height);
    }

    window.addEventListener("resize", () => {
      if (document.getElementById("drawingScreen").style.display === "flex") {
        resizeCanvas();
      }
    });


    /* =========================
       仮のお絵かき機能
       次の段階で本格化する
    ========================= */

    let drawing = false;

    function getPosition(event) {
      const rect = canvas.getBoundingClientRect();

      return {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
      };
    }

    canvas.addEventListener("pointerdown", (event) => {
      drawing = true;

      const pos = getPosition(event);

      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    });

    canvas.addEventListener("pointermove", (event) => {
      if (!drawing) return;

      const pos = getPosition(event);

      ctx.lineWidth = 4;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#333";

      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    });

    canvas.addEventListener("pointerup", () => {
      drawing = false;
    });

    canvas.addEventListener("pointercancel", () => {
      drawing = false;
    });

  </script>

</body>
</html>
