<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="おえかきランド">
<title>おえかきランド</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:#f7f8fc;color:#333}body{min-height:100vh;min-height:100dvh;overscroll-behavior:none}button{font:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#homeScreen{width:100%;min-height:100vh;min-height:100dvh;padding:24px 20px 40px;display:flex;flex-direction:column;align-items:center;overflow:auto}
.title-banner{display:block;width:min(100%,1100px);height:auto;max-height:300px;object-fit:contain;margin:0 auto 12px}
.subtitle{margin:0 0 28px;font-size:clamp(15px,3vw,21px);font-weight:700;color:#777;text-align:center}
.menu{width:min(900px,100%);display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.menu-button{min-height:105px;border:3px solid #333;border-radius:22px;background:#fff;color:#333;font-size:clamp(20px,4vw,30px);font-weight:800;cursor:pointer;box-shadow:0 5px 0 #333;transition:transform .08s,box-shadow .08s}.menu-button:active{transform:translateY(5px);box-shadow:0 0 0 #333}.menu-button .small{display:block;margin-top:7px;font-size:13px;font-weight:500;color:#888}.menu-button.preparing{background:#eee;color:#999;border-color:#aaa;box-shadow:0 5px 0 #aaa}.random-button{grid-column:1/-1;min-height:82px;background:#333;color:#fff;border-color:#333;box-shadow:0 5px 0 #111}
#drawingScreen{display:none;width:100%;height:100vh;height:100dvh;position:fixed;inset:0;background:#fff;flex-direction:column;overflow:hidden}.drawing-header{height:58px;min-height:58px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:8px max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));border-bottom:2px solid #ddd;background:#fafafa}.header-button{min-width:76px;min-height:42px;padding:8px 14px;border:2px solid #333;border-radius:12px;background:#fff;font-weight:700;cursor:pointer}.drawing-title{font-size:20px;font-weight:800}
#canvasArea{flex:1;min-height:0;position:relative;background:#fff;overflow:hidden}#drawingCanvas{display:block;width:100%;height:100%;background:#fff;touch-action:none;cursor:crosshair}
#colorPalette{position:absolute;left:30px;top:30px;width:250px;padding:12px;background:#fff;border:3px solid #333;border-radius:18px;box-shadow:0 5px 18px rgba(0,0,0,.20);z-index:30;display:none;user-select:none;-webkit-user-select:none}#colorPalette.show{display:block}.palette-header{height:36px;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;cursor:grab;touch-action:none}.palette-header:active{cursor:grabbing}.palette-title{font-size:17px;font-weight:800;padding-left:4px}.palette-close{width:36px;height:36px;border:2px solid #333;border-radius:50%;background:#fff;font-size:22px;line-height:1;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}.palette-close:active{background:#eee}.color-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:11px}.color-button{width:100%;aspect-ratio:1;border:2px solid #555;border-radius:50%;cursor:pointer;padding:0;touch-action:manipulation}.color-button.selected{outline:4px solid #333;outline-offset:2px}
.drawing-toolbar{min-height:82px;flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px max(10px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));border-top:2px solid #ddd;background:#fafafa;overflow-x:auto;-webkit-overflow-scrolling:touch}.tool-button{flex:0 0 auto;min-width:72px;min-height:58px;padding:7px 10px;border:2px solid #333;border-radius:13px;background:#fff;font-size:14px;font-weight:700;cursor:pointer}.tool-button.active{background:#333;color:#fff}.tool-icon{display:block;font-size:23px;line-height:24px;margin-bottom:3px}
.confirm-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;align-items:center;justify-content:center;padding:20px}.confirm-overlay.show{display:flex}.confirm-box{width:min(400px,100%);padding:25px;background:#fff;border:3px solid #333;border-radius:20px;text-align:center}.confirm-box h2{margin:0 0 10px;font-size:23px}.confirm-box p{margin:0 0 22px;color:#666}.confirm-buttons{display:flex;gap:10px}.confirm-buttons button{flex:1;min-height:52px;border:2px solid #333;border-radius:12px;background:#fff;font-weight:700}.confirm-buttons .danger{background:#333;color:#fff}
@media(max-width:700px){#homeScreen{padding:18px 14px 30px}.title-banner{max-height:220px;margin-bottom:8px}.menu{gap:12px}.menu-button{min-height:90px;border-radius:18px}.drawing-toolbar{justify-content:flex-start}#colorPalette{width:230px}.color-grid{gap:9px}}
@media(min-width:701px){.menu{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<main id="homeScreen">
  <img class="title-banner" src="https://mrs-shrimp.github.io/oekaki-land/image/title.png" alt="おえかきランド">
  <p class="subtitle">すきなあそびをえらんでね</p>
  <div class="menu">
    <button class="menu-button" onclick="openDrawing()">じゆうにおえかき<span class="small">すきなものをかこう</span></button>
    <button class="menu-button preparing">おだいにちょうせん<span class="small">じゅんびちゅう</span></button>
    <button class="menu-button preparing">おえかきタイムアタック<span class="small">じゅんびちゅう</span></button>
    <button class="menu-button preparing">へんなおだい<span class="small">じゅんびちゅう</span></button>
    <button class="menu-button preparing">おえかきしりとり<span class="small">じゅんびちゅう</span></button>
    <button class="menu-button preparing">へんしんおえかき<span class="small">じゅんびちゅう</span></button>
    <button class="menu-button preparing">すたんぷあそび<span class="small">じゅんびちゅう</span></button>
    <button class="menu-button preparing">まちをつくろう<span class="small">じゅんびちゅう</span></button>
    <button class="menu-button preparing">わたしのさくひん<span class="small">じゅんびちゅう</span></button>
    <button class="menu-button random-button" onclick="randomMode()">なにしてあそぶ？</button>
  </div>
</main>

<section id="drawingScreen">
  <header class="drawing-header">
    <button class="header-button" onclick="closeDrawing()">← もどる</button>
    <div class="drawing-title">じゆうにおえかき</div>
    <button class="header-button" onclick="saveImage()">ほぞん</button>
  </header>
  <div id="canvasArea">
    <canvas id="drawingCanvas"></canvas>
    <div id="colorPalette">
      <div class="palette-header" id="paletteDragHandle">
        <div class="palette-title">いろ</div>
        <button class="palette-close" onclick="closeColorPalette(event)">×</button>
      </div>
      <div class="color-grid">
        <button class="color-button selected" style="background:#222222" data-color="#222222" onclick="selectColor(this)"></button>
        <button class="color-button" style="background:#e53935" data-color="#e53935" onclick="selectColor(this)"></button>
        <button class="color-button" style="background:#ff7043" data-color="#ff7043" onclick="selectColor(this)"></button>
        <button class="color-button" style="background:#fbc02d" data-color="#fbc02d" onclick="selectColor(this)"></button>
        <button class="color-button" style="background:#43a047" data-color="#43a047" onclick="selectColor(this)"></button>
        <button class="color-button" style="background:#00acc1" data-color="#00acc1" onclick="selectColor(this)"></button>
        <button class="color-button" style="background:#1e88e5" data-color="#1e88e5" onclick="selectColor(this)"></button>
        <button class="color-button" style="background:#8e24aa" data-color="#8e24aa" onclick="selectColor(this)"></button>
        <button class="color-button" style="background:#ec407a" data-color="#ec407a" onclick="selectColor(this)"></button>
        <button class="color-button" style="background:#795548" data-color="#795548" onclick="selectColor(this)"></button>
        <button class="color-button" style="background:#90a4ae" data-color="#90a4ae" onclick="selectColor(this)"></button>
        <button class="color-button" style="background:#ffffff" data-color="#ffffff" onclick="selectColor(this)"></button>
      </div>
    </div>
  </div>
  <div class="drawing-toolbar">
    <button id="pencilButton" class="tool-button active" onclick="setTool('pencil')"><span class="tool-icon">✏️</span>えんぴつ</button>
    <button id="eraserButton" class="tool-button" onclick="setTool('eraser')"><span class="tool-icon">🧽</span>けしごむ</button>
    <button id="colorButton" class="tool-button" onclick="toggleColorPalette()"><span class="tool-icon">🎨</span>いろ</button>
    <button id="sizeButton" class="tool-button" onclick="selectSizeTool()"><span class="tool-icon">●</span>ふとさ</button>
    <button id="fillButton" class="tool-button" onclick="setTool('fill')"><span class="tool-icon">💧</span>ぬりつぶし</button>
    <button class="tool-button" onclick="undo()"><span class="tool-icon">↩</span>もどす</button>
    <button class="tool-button" onclick="redo()"><span class="tool-icon">↪</span>すすむ</button>
    <button class="tool-button" onclick="confirmClear()"><span class="tool-icon">🗑</span>ぜんぶけす</button>
  </div>
</section>

<div id="confirmOverlay" class="confirm-overlay">
  <div class="confirm-box">
    <h2>ぜんぶけしていい？</h2>
    <p>かいたものが なくなります。</p>
    <div class="confirm-buttons">
      <button onclick="closeConfirm()">やめる</button>
      <button class="danger" onclick="clearCanvas()">けす</button>
    </div>
  </div>
</div>

<script>
function openDrawing(){document.getElementById('homeScreen').style.display='none';document.getElementById('drawingScreen').style.display='flex';setTimeout(resizeCanvas,50)}
function closeDrawing(){document.getElementById('drawingScreen').style.display='none';document.getElementById('homeScreen').style.display='flex'}
function randomMode(){alert('これから いろいろな あそびを つくっていくよ！')}

const canvas=document.getElementById('drawingCanvas');
const ctx=canvas.getContext('2d',{willReadFrequently:true});
let canvasWidth=0,canvasHeight=0;
function resizeCanvas(){const rect=canvas.getBoundingClientRect(),ratio=window.devicePixelRatio||1;canvasWidth=rect.width;canvasHeight=rect.height;canvas.width=Math.floor(rect.width*ratio);canvas.height=Math.floor(rect.height*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,canvasWidth,canvasHeight);if(history.length===0)saveHistory()}
window.addEventListener('resize',()=>{if(document.getElementById('drawingScreen').style.display==='flex')resizeCanvas()});

let currentTool='pencil',currentColor='#222222',currentSize=7,isDrawing=false;
function setTool(tool){currentTool=tool;document.querySelectorAll('.tool-button').forEach(b=>b.classList.remove('active'));if(tool==='pencil'){document.getElementById('pencilButton').classList.add('active');canvas.style.cursor='crosshair'}if(tool==='eraser'){document.getElementById('eraserButton').classList.add('active');canvas.style.cursor='cell'}if(tool==='fill'){document.getElementById('fillButton').classList.add('active');canvas.style.cursor='cell'}/* パレットはここでは閉じない */}
function toggleColorPalette(){document.getElementById('colorPalette').classList.toggle('show')}
function closeColorPalette(event){if(event)event.stopPropagation();document.getElementById('colorPalette').classList.remove('show')}
function selectColor(button){currentColor=button.dataset.color;document.querySelectorAll('.color-button').forEach(b=>b.classList.remove('selected'));button.classList.add('selected');setTool('pencil');document.getElementById('colorButton').style.borderColor=currentColor}
function selectSizeTool(){const sizes=[3,7,14,28],index=sizes.indexOf(currentSize);currentSize=sizes[(index+1)%sizes.length];const b=document.getElementById('sizeButton');b.style.borderWidth='4px';setTimeout(()=>b.style.borderWidth='2px',120)}
function getPosition(event){const r=canvas.getBoundingClientRect();return{x:event.clientX-r.left,y:event.clientY-r.top}}
canvas.addEventListener('pointerdown',startDrawing);canvas.addEventListener('pointermove',draw);canvas.addEventListener('pointerup',stopDrawing);canvas.addEventListener('pointercancel',stopDrawing);canvas.addEventListener('pointerleave',stopDrawing);
function startDrawing(event){event.preventDefault();const p=getPosition(event);if(currentTool==='fill'){saveHistory();floodFill(Math.floor(p.x),Math.floor(p.y));return}isDrawing=true;try{canvas.setPointerCapture(event.pointerId)}catch(e){}ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=currentSize;if(currentTool==='eraser'){ctx.globalCompositeOperation='destination-out'}else{ctx.globalCompositeOperation='source-over';ctx.strokeStyle=currentColor}ctx.lineTo(p.x+.01,p.y+.01);ctx.stroke()}
function draw(event){if(!isDrawing)return;event.preventDefault();const p=getPosition(event);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.beginPath();ctx.moveTo(p.x,p.y)}
function stopDrawing(event){if(!isDrawing)return;isDrawing=false;try{canvas.releasePointerCapture(event.pointerId)}catch(e){}ctx.closePath();ctx.globalCompositeOperation='source-over';saveHistory()}

let history=[],historyIndex=-1,restoringHistory=false;
function getCanvasData(){return canvas.toDataURL('image/png')}
function saveHistory(){if(restoringHistory)return;const image=getCanvasData();history=history.slice(0,historyIndex+1);history.push(image);if(history.length>30)history.shift();historyIndex=history.length-1}
function restoreHistory(imageData){restoringHistory=true;const image=new Image();image.onload=()=>{ctx.clearRect(0,0,canvasWidth,canvasHeight);ctx.globalCompositeOperation='source-over';ctx.drawImage(image,0,0,canvasWidth,canvasHeight);restoringHistory=false};image.src=imageData}
function undo(){if(historyIndex<=0)return;historyIndex--;restoreHistory(history[historyIndex])}
function redo(){if(historyIndex>=history.length-1)return;historyIndex++;restoreHistory(history[historyIndex])}
function confirmClear(){document.getElementById('confirmOverlay').classList.add('show')}
function closeConfirm(){document.getElementById('confirmOverlay').classList.remove('show')}
function clearCanvas(){closeConfirm();saveHistory();ctx.globalCompositeOperation='source-over';ctx.fillStyle='#fff';ctx.fillRect(0,0,canvasWidth,canvasHeight);saveHistory()}
function floodFill(startX,startY){const width=canvas.width,height=canvas.height,ratio=window.devicePixelRatio||1,x=Math.floor(startX*ratio),y=Math.floor(startY*ratio);if(x<0||x>=width||y<0||y>=height)return;const imageData=ctx.getImageData(0,0,width,height),data=imageData.data,i=(y*width+x)*4,tr=data[i],tg=data[i+1],tb=data[i+2],ta=data[i+3],fc=hexToRgba(currentColor);if(tr===fc.r&&tg===fc.g&&tb===fc.b&&ta===255)return;const tolerance=25;const matches=index=>Math.abs(data[index]-tr)<=tolerance&&Math.abs(data[index+1]-tg)<=tolerance&&Math.abs(data[index+2]-tb)<=tolerance&&Math.abs(data[index+3]-ta)<=tolerance;const stack=[[x,y]];while(stack.length){const [px,py]=stack.pop();if(px<0||px>=width||py<0||py>=height)continue;const index=(py*width+px)*4;if(!matches(index))continue;data[index]=fc.r;data[index+1]=fc.g;data[index+2]=fc.b;data[index+3]=255;stack.push([px+1,py],[px-1,py],[px,py+1],[px,py-1])}ctx.putImageData(imageData,0,0);saveHistory()}
function hexToRgba(hex){hex=hex.replace('#','');return{r:parseInt(hex.substring(0,2),16),g:parseInt(hex.substring(2,4),16),b:parseInt(hex.substring(4,6),16),a:255}}
function saveImage(){const link=document.createElement('a');link.download='おえかき.png';link.href=canvas.toDataURL('image/png');link.click()}

const palette=document.getElementById('colorPalette'),paletteHandle=document.getElementById('paletteDragHandle');let paletteDragging=false,palettePointerId=null,paletteOffsetX=0,paletteOffsetY=0;
paletteHandle.addEventListener('pointerdown',startPaletteDrag);paletteHandle.addEventListener('pointermove',movePalette);paletteHandle.addEventListener('pointerup',stopPaletteDrag);paletteHandle.addEventListener('pointercancel',stopPaletteDrag);
function startPaletteDrag(event){event.preventDefault();event.stopPropagation();paletteDragging=true;palettePointerId=event.pointerId;const r=palette.getBoundingClientRect();paletteOffsetX=event.clientX-r.left;paletteOffsetY=event.clientY-r.top;try{paletteHandle.setPointerCapture(event.pointerId)}catch(e){}}
function movePalette(event){if(!paletteDragging||event.pointerId!==palettePointerId)return;event.preventDefault();event.stopPropagation();const area=document.getElementById('canvasArea'),r=area.getBoundingClientRect();let left=event.clientX-r.left-paletteOffsetX,top=event.clientY-r.top-paletteOffsetY;const maxLeft=r.width-palette.offsetWidth-5,maxTop=r.height-palette.offsetHeight-5;palette.style.left=Math.max(5,Math.min(left,maxLeft))+'px';palette.style.top=Math.max(5,Math.min(top,maxTop))+'px'}
function stopPaletteDrag(event){if(event.pointerId!==palettePointerId)return;paletteDragging=false;palettePointerId=null;try{paletteHandle.releasePointerCapture(event.pointerId)}catch(e){}}
</script>
</body>
</html>
